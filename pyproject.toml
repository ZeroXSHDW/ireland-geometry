[build-system]
requires = ["setuptools==83.0.0", "wheel==0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "ireland-geometry-scan"
version = "0.4.0"
description = "Reproducible geospatial and statistical analysis of Irish building footprints"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "shapely>=2.0",
  "requests>=2.31",
  "osmium>=3.6",
]

[project.scripts]
ireland-geometry = "run_pipeline:main"
ireland-geometry-doctor = "scripts.doctor:main"
ireland-geometry-serve = "scripts.serve_report:main"
ireland-geometry-route = "scripts.route_query:main"
ireland-geometry-route-matrix = "scripts.route_matrix:main"
ireland-geometry-route-compare = "scripts.route_compare:main"
ireland-geometry-query = "scripts.query_data:main"
ireland-geometry-bundle = "scripts.bundle:main"
ireland-geometry-schema-audit = "scripts.schema_audit:main"
ireland-geometry-repro = "scripts.repro_check:main"
ireland-geometry-release-check = "scripts.release_check:main"

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "ruff>=0.6",
]
data = [
  "duckdb>=1.0",
  "pyarrow>=17",
]
geo3d = [
  "laspy>=2.5",
  "rasterio>=1.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools]
packages = ["scripts", "schemas"]
py-modules = ["run_pipeline"]

[tool.setuptools.package-data]
schemas = ["*.json"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.pyc", "*.pyo"]
