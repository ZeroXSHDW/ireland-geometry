[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ireland-geometry-scan"
version = "0.2.0"
description = "Reproducible geospatial and statistical analysis of Irish building footprints"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "shapely>=2.0",
  "requests>=2.31",
  "pyosmium>=3.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools]
packages = ["scripts"]
