ies']['report_server']['query_json_post'] is True; assert result['capabilities']['report_server']['query_json_max_body_bytes'] == 131072; assert result['capabilities']['report_server']['report_page_json_post'] is True; assert result['capabilities']['report_server']['report_page_json_max_body_bytes'] == 131072; assert result['capabilities']['report_server']['report_export_json_post'] is True; assert result['capabilities']['report_server']['report_export_json_max_body_bytes'] == 131072; assert 'output_alignment' in result['capabilities']['validation']; assert result['capabilities']['validation']['source_alignment']['contract']=='ireland-geometry.source-alignment.v1'; assert result['capabilities']['validation']['source_alignment']['symlink_count']==0; assert result['capabilities']['bundle']['contract']=='ireland-geometry.bundle.v1'; assert result['capabilities']['bundle']['deterministic_zip'] is True; assert result['capabilities']['bundle']['verifies_archives'] is True; assert result['capabilities']['bundle']['extracts_archives'] is True; assert result['capabilities']['bundle']['requires_verified_guard'] is True; assert result['capabilities']['bundle']['requires_complete_validation'] is True; assert result['capabilities']['bundle']['rejects_symlinks'] is True; assert result['capabilities']['bundle']['checks_manifest_artifacts'] is True; assert result['capabilities']['release_check']['contract']=='ireland-geometry.release-check.v1'; assert result['capabilities']['release_check']['read_only'] is True; assert result['capabilities']['release_check']['checks_doctor'] is True; assert result['capabilities']['release_check']['checks_output'] is True; assert result['capabilities']['release_check']['checks_output_inventory'] is True; assert result['capabilities']['release_check']['checks_output_symlinks'] is True; assert result['capabilities']['release_check']['rejects_symlink_roots'] is True; assert result['capabilities']['release_check']['checks_validation_records'] is True; assert result['capabilities']['release_check']['checks_pages'] is True; assert result['capabilities']['release_check']['checks_bundle'] is True; assert result['capabilities']['release_check']['checks_source_alignment'] is True; assert result['capabilities']['validation']['manifest_coverage']['recursive'] is True; assert result['capabilities']['validation']['manifest_coverage']['rejects_symlinks'] is True; assert result['capabilities']['pages']['publisher_checks_manifest_artifacts'] is True; assert result['capabilities']['analysis_plan']['source']=='packaged'; assert result['capabilities']['analysis_plan']['status']=='available'\""
      - run: cd /tmp && python -c "import json; result=json.load(open('/tmp/ireland-geometry-package-doctor.json')); assert isinstance(result['capabilities']['reports']['runtime_reload_notice'], bool); assert isinstance(result['capabilities']['reports']['report_error_recovery'], bool); assert isinstance(result['capabilities']['reports']['lazy_initial_load_retry'], bool); assert result['capabilities']['report_server']['api_error_request_ids'] is True; assert result['capabilities']['report_server']['api_request_logging'] is True; assert result['capabilities']['report_server']['security_response_headers'] is True; assert result['capabilities']['report_server']['api_request_timing'] is True; assert result['capabilities']['report_server']['request_id_all_responses'] is True; assert result['capabilities']['report_server']['request_id_all_response_logging'] is True"
      - run: cd /tmp && python -c "import json; result=json.load(open('/tmp/ireland-geometry-package-doctor.json')); assert result['capabilities']['bundle']['rejects_archive_input_symlink'] is True; assert result['capabilities']['bundle']['rejects_extraction_parent_symlink'] is True"
      - run: cd /tmp && python -c "import json; result=json.load(open('/tmp/ireland-geometry-package-doctor.json')); assert result['capabilities']['report_server']['report_page_next_offset'] is True"
      - run: cd /tmp && python -c "import json; result=json.load(open('/tmp/ireland-geometry-package-doctor.json')); assert result['capabilities']['report_server']['report_page_sort_tiebreaker'] is True"
      - run: cd /tmp && python -c "import json; result=json.load(open('/tmp/ireland-geometry-package-doctor.json')); assert result['capabilities']['report_server']['conditional_api_responses'] is True"
      - run: cd /tmp && python -c "import json; result=json.load(open('/tmp/ireland-geometry-package-doctor.json')); assert result['capabilities']['report_server']['api_json_gzip'] is True"
      - run: cd /tmp && python -c "import json; result=json.load(open('/tmp/ireland-geometry-package-doctor.json')); assert result['capabilities']['report_server']['head_api'] is True"
      - run: cd /tmp && python -c "import json; route=json.load(open('/tmp/ireland-geometry-package-doctor.json'))['capabilities']['route_query']; assert route['supports_ferry_schedules'] is True; assert route['supports_ferry_durations'] is True; assert route['supports_conditional_access_profiles'] is True; assert route['conditional_access_profiles'] is True; assert route['portable_path_segments'] is True; assert route['path_segment_sources']==['sqlite_edges','portable_edges','not_available']; assert route['ferry_schedules_modeled'] is True; assert route['ferry_schedule_contract']=='ireland-geometry.ferry-schedules.v1'"
      - run: cd /tmp && ireland-geometry-query --help
      - run: python -c "import subprocess; result=subprocess.run(['ireland-geometry-query','--help'], check=True, capture_output=True, text=True); assert '--after-invalid-osm-id' in result.stdout"
      - run: cd /tmp && ireland-geometry-route --help
      - run: cd /tmp && ireland-geometry-route-matrix --help
      - run: cd /tmp && ireland-geometry-route-compare --help
      - run: cd /tmp && ireland-geometry-serve --help
      - run: cd /tmp && python -c "import json; result=json.load(open('/tmp/ireland-geometry-package-doctor.json')); assert result['capabilities']['report_server']['active_graph_capabilities'] is True"
      - run: cd /tmp && ireland-geometry-bundle --help
