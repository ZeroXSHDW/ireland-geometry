name: Ireland geometry checks

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ireland-geometry-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m ruff check scripts tests run_pipeline.py
      - run: python -m compileall -q scripts run_pipeline.py
      - run: python run_pipeline.py --help
      - run: ireland-geometry --help
      - run: ireland-geometry-doctor --json
      - run: ireland-geometry-serve --help
      - run: ireland-geometry-schema-audit --help
      - run: ireland-geometry-repro --help
      - run: ireland-geometry-release-check --help
      - run: python scripts/schema_audit.py --help
      - run: python scripts/repro_check.py --help

  optional-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,data]"
      - run: python -c "import duckdb, pyarrow; print(f'duckdb={duckdb.__version__} pyarrow={pyarrow.__version__}')"
      - run: python -m pytest
      - run: python -m ruff check scripts tests run_pipeline.py
      - run: python -m compileall -q scripts run_pipeline.py
      - run: ireland-geometry-doctor --json
      - run: ireland-geometry-serve --help

  optional-geo3d:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,geo3d]"
      - run: python -c "import laspy, rasterio; print(f'laspy={laspy.__version__} rasterio={rasterio.__version__}')"
      - run: python -m pytest
      - run: python -m ruff check scripts tests run_pipeline.py
      - run: python -m compileall -q scripts run_pipeline.py
      - run: ireland-geometry-doctor --json
      - run: ireland-geometry-serve --help

  package-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir wheelhouse
      - name: Verify wheel excludes bytecode caches
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheel = next(Path("wheelhouse").glob("*.whl"))
          with zipfile.ZipFile(wheel) as handle:
              names = handle.namelist()
          forbidden = [
              name for name in names
              if "__pycache__/" in name or name.endswith((".pyc", ".pyo"))
          ]
          assert not forbidden, forbidden
          print("wheel bytecode hygiene verified")
          PY
      - run: |
          mkdir -p sdist
          python - <<'PY'
          from setuptools.build_meta import build_sdist

          print(build_sdist("sdist"))
          PY
          test "$(find sdist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1
          python - <<'PY'
          from pathlib import Path
          import tarfile

          archive = next(Path("sdist").glob("*.tar.gz"))
          with tarfile.open(archive, "r:gz") as handle:
              names = set(handle.getnames())
          forbidden = [
              name for name in names
              if "__pycache__/" in name or name.endswith((".pyc", ".pyo"))
          ]
          assert not forbidden, forbidden
          root = next(name for name in names if "/" not in name)
          for relative in (
              "analysis_plan.json",
              "schemas/analysis_plan.json",
              "data/lidar/README.md",
              "data/roads/README.md",
              "data/boundaries/README.md",
          ):
              assert f"{root}/{relative}" in names, relative
          print("sdist source assets verified")
          PY
      - run: python -m pip install --force-reinstall --no-deps wheelhouse/*.whl
      - run: cd /tmp && python -c "from importlib.resources import files; import run_pipeline; assert files('schemas').joinpath('artifacts.json').is_file(); assert files('schemas').joinpath('analysis_plan.json').is_file(); assert files('schemas').joinpath('ferry_schedules.json').is_file(); assert (files('schemas').joinpath('artifacts.json')).read_text(encoding='utf-8').startswith('{'); assert 'build_interpretation' in files('scripts').joinpath('report.py').read_text(encoding='utf-8'); assert files('scripts').joinpath('pages_audit.py').is_file(); assert files('scripts').joinpath('publish_pages.py').is_file(); assert files('scripts').joinpath('release_check.py').is_file()"
      - name: Execute dependency-light packaged report page
        run: |
          cd /tmp
          python - <<'PY'
          import hashlib
          import json
          import tempfile
          import threading
          import urllib.request
          from pathlib import Path

          from scripts.pages_audit import audit_site
          from scripts.release_check import check_release
          from scripts.serve_report import create_server, report_url

          with tempfile.TemporaryDirectory(prefix="ireland-geometry-report-smoke-") as raw_root:
              output = Path(raw_root) / "output"
              output.mkdir()
              (output / "report_lazy.html").write_text("<html>smoke</html>", encoding="utf-8")
              (output / "report_data.json").write_text(
                  json.dumps(
                      {
                          "targets": [],
                          "summary": {"analysis_ready": True},
                          "interpretation": {"findings": [], "caveats": []},
                      }
                  ),
                  encoding="utf-8",
              )
              for name in ("verification", "schema_validation", "reproducibility"):
                  (output / f"{name}.json").write_text(
                      json.dumps({"passed": True}), encoding="utf-8"
                  )
              records = []
              for path in sorted(output.iterdir()):
                  records.append(
                      {
                          "relative_path": path.name,
                          "path_base": "output_dir",
                          "bytes": path.stat().st_size,
                          "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                      }
                  )
              (output / "manifest.json").write_text(
                  json.dumps({"artifacts": records}), encoding="utf-8"
              )
              server = create_server(output, host="127.0.0.1", port=0)
              thread = threading.Thread(target=server.serve_forever, daemon=True)
              thread.start()
              try:
                  base = report_url(server, server.report_name).rsplit("/", 1)[0]
                  with urllib.request.urlopen(
                      f"{base}/api/report/page?initial=1&limit=1", timeout=10
                  ) as response:
                      page = json.load(response)
                  assert page["runtime"]["contract"] == "ireland-geometry.report-runtime.v1"
                  assert page["runtime"]["status"] == "pass"
                  assert page["runtime"]["analysis_ready"] is True
                  assert page["summary"]["analysis_ready"] is True
                  with urllib.request.urlopen(
                      f"{base}/api/report/runtime", timeout=10
                  ) as response:
                      runtime = json.load(response)
                  assert runtime["contract"] == "ireland-geometry.report-runtime.v1"
                  assert runtime["status"] == "pass"
                  assert runtime["analysis_ready"] is True
                  with urllib.request.urlopen(
                      f"{base}/api/report/export?format=csv", timeout=10
                  ) as response:
                      response.read()
                      assert response.headers["X-Ireland-Geometry-Runtime-Contract"] == "ireland-geometry.report-runtime.v1"
                      assert response.headers["X-Ireland-Geometry-Runtime-Status"] == "pass"
                      assert response.headers["X-Ireland-Geometry-Analysis-Ready"] == "true"
                      assert response.headers["X-Ireland-Geometry-Validation"] == "pass"
                      assert response.headers["X-Ireland-Geometry-Manifest-Alignment"] == "pass"
              finally:
                  server.shutdown()
                  server.server_close()
                  thread.join(timeout=10)
          print("dependency-light packaged report page passed")
          PY
      - name: Execute packaged Pages publisher
        run: |
          cd /tmp
          python - <<'PY'
          import hashlib
          import json
          import tempfile
          from pathlib import Path

          from scripts.publish_pages import publish_pages

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          with tempfile.TemporaryDirectory(prefix="ireland-geometry-pages-smoke-") as raw_root:
              root = Path(raw_root)
              output = root / "output"
              site = root / "docs"
              output.mkdir()
              generated_at = "2026-08-18T00:00:00+00:00"
              pack = {
                  "targets": [{"osm_id": "way/1"}],
                  "summary": {"targets": 1, "review_queue_targets": 1, "analysis_ready": True},
                  "geojson": {
                      "type": "FeatureCollection",
                      "features": [{"type": "Feature", "properties": {"osm_id": "way/1"}}],
                  },
                  "manifest": {"generated_at": generated_at, "git_revision": "package-smoke"},
                  "pattern_catalog": [{"key": "golden_ratio"}],
                  "scoring": {
                      "contract": "ireland-geometry.exploratory-score.v1",
                      "version": 1,
                      "config_sha256": "a" * 64,
                  },
                  "interpretation": {"caveats": []},
              }
              (output / "report.html").write_text(
                  "<script>const PACK = "
                  + json.dumps(pack, separators=(",", ":"))
                  + ";</script>",
                  encoding="utf-8",
              )
              (output / "review.html").write_text(
                  "<script>const DATA=[{\"osm_id\":\"way/1\"}];"
                  "const QUEUE_KEY='queue';const BACKUP_SCHEMA='ireland-geometry-review-v1';"
                  "localStorage;function downloadJson(){}async function importJson(){}</script>",
                  encoding="utf-8",
              )
              (output / "verification.json").write_text(
                  json.dumps(
                      {
                          "passed": True,
                          "manifest_cache_alignment": {"status": "pass"},
                      }
                  ),
                  encoding="utf-8",
              )
              (output / "schema_validation.json").write_text(
                  json.dumps({"passed": True}), encoding="utf-8"
              )
              (output / "reproducibility.json").write_text(
                  json.dumps({"passed": True}), encoding="utf-8"
              )
              manifest = {
                  "generated_at": generated_at,
                  "git_revision": "package-smoke",
                  "artifacts": [],
              }
              for name in (
                  "report.html",
                  "review.html",
                  "verification.json",
                  "schema_validation.json",
                  "reproducibility.json",
              ):
                  path = output / name
                  manifest["artifacts"].append(
                      {
                          "relative_path": name,
                          "path_base": "output_dir",
                          "bytes": path.stat().st_size,
                          "sha256": sha256(path),
                      }
                  )
              (output / "manifest.json").write_text(json.dumps(manifest), encoding="utf-8")

              result = publish_pages(output, site)
              assert result["published"] is True
              assert result["audit"]["passed"] is True
              publication = json.loads(
                  (site / "pages_manifest.json").read_text(encoding="utf-8")
              )
              assert publication["source_manifest_sha256"] == sha256(output / "manifest.json")
              assert publication["source_verification_sha256"] == sha256(
                  output / "verification.json"
              )
          print("packaged Pages publisher smoke passed")
          PY
      - name: Exercise packaged symlink guards
        run: |
          cd /tmp
          python - <<'PY'
          import json
          import subprocess
          import threading
          import tempfile
          import urllib.error
          import urllib.request
          from pathlib import Path

          from scripts.pages_audit import audit_site
          from scripts.release_check import check_release
          from scripts.serve_report import create_server, report_url

          with tempfile.TemporaryDirectory(prefix="ireland-geometry-symlink-smoke-") as raw_root:
              root = Path(raw_root)
              output = root / "output"
              output.mkdir()
              server_output = root / "server-output"
              server_output.mkdir()
              (server_output / "report_lazy.html").write_text("ok", encoding="utf-8")
              server_link = server_output / "linked.txt"
              server_link.symlink_to(root / "target.txt")
              try:
                  create_server(server_output)
              except ValueError as exc:
                  assert "symlink" in str(exc).lower()
              else:
                  raise AssertionError("report server accepted a symlinked output")
              runtime_output = root / "server-runtime"
              runtime_output.mkdir()
              (runtime_output / "report_lazy.html").write_text("ok", encoding="utf-8")
              runtime_server = create_server(runtime_output, port=0)
              (root / "runtime-target.txt").write_text("secret", encoding="utf-8")
              (runtime_output / "leak.txt").symlink_to(root / "runtime-target.txt")
              runtime_thread = threading.Thread(
                  target=runtime_server.serve_forever,
                  daemon=True,
              )
              runtime_thread.start()
              try:
                  runtime_base = report_url(
                      runtime_server,
                      runtime_server.report_name,
                  ).rsplit("/", 1)[0]
                  try:
                      urllib.request.urlopen(
                          f"{runtime_base}/leak.txt",
                          timeout=2,
                      )
                  except urllib.error.HTTPError as exc:
                      assert exc.code == 404
                  else:
                      raise AssertionError(
                          "report server served a symlink added after startup"
                      )
              finally:
                  runtime_server.shutdown()
                  runtime_server.server_close()
                  runtime_thread.join(timeout=2)
              target = root / "target.csv"
              target.write_text("value\n1\n", encoding="utf-8")
              (output / "linked.csv").symlink_to(target)
              repro = subprocess.run(
                  ["ireland-geometry-repro", "--json", "--out-dir", str(output)],
                  check=False,
                  capture_output=True,
                  text=True,
              )
              assert repro.returncode == 1
              repro_result = json.loads(repro.stdout)
              assert repro_result["symlinks"] == ["linked.csv"]

              linked_output = root / "linked-output"
              linked_output.symlink_to(output, target_is_directory=True)
              bundle = subprocess.run(
                  [
                      "ireland-geometry-bundle",
                      "--json",
                      "--out-dir",
                      str(linked_output),
                      "--archive",
                      str(root / "bundle.zip"),
                  ],
                  check=False,
                  capture_output=True,
                  text=True,
              )
              assert bundle.returncode == 2
              assert "symlink" in bundle.stderr.lower()
              site_target = root / "site-target"
              site_target.mkdir()
              linked_site = root / "linked-site"
              linked_site.symlink_to(site_target, target_is_directory=True)
              page_audit = audit_site(linked_site)
              assert page_audit["passed"] is False
              assert any(
                  "Pages site directory must not be a symlink" in error
                  for error in page_audit["errors"]
              )
              release = check_release(root, out_dir=linked_output, skip_pages=True)
              assert release["path_boundary"]["passed"] is False
              assert any(
                  "output directory must not be a symlink" in error
                  for error in release["errors"]
              )
          print("packaged symlink guards passed")
          PY
      - run: cd /tmp && ireland-geometry --help
      - run: cd /tmp && ireland-geometry-doctor --help
      - run: cd /tmp && ireland-geometry-doctor --json > /tmp/ireland-geometry-package-doctor.json
      - run: "python -c \"import importlib.metadata, json; result=json.load(open('/tmp/ireland-geometry-package-doctor.json')); health=result['capabilities']['query']['backend_health']; assert set(health)=={'duckdb','parquet','csv','jsonl'}; assert all('readable' in item and 'error' in item for item in health.values()); assert result['doctor_version']==156; assert 'strict_blockers' in result['summary']; assert result['source_freshness']['contract']=='ireland-geometry.freshness.v1'; assert result['package_version']==importlib.metadata.version('ireland-geometry-scan'); commands=result['capabilities']['commands']; assert commands['command_count']==11; assert commands['installed_count']==11; assert commands['installation_status']=='available'; assert all(item['installed'] for item in commands['commands'].values()); assert 'ireland-geometry-bundle' in commands['commands']; assert 'ireland-geometry-route-matrix' in commands['commands']; assert 'ireland-geometry-route-compare' in commands['commands']; assert 'ireland-geometry-schema-audit' in commands['commands']; assert 'ireland-geometry-repro' in commands['commands']; assert 'ireland-geometry-release-check' in commands['commands']; assert result['capabilities']['pipeline']['diagnostic_json_outputs'] is True; assert result['capabilities']['pipeline']['reproducibility_rejects_symlinks'] is True; assert result['capabilities']['pipeline']['post_validation_report_refresh'] is True; assert result['capabilities']['pipeline']['post_validation_bundle'] is True; assert result['capabilities']['pipeline']['rejects_output_symlink'] is True; assert result['capabilities']['pipeline']['rejects_nested_symlinks'] is True; assert result['capabilities']['output_safety']['status']=='available'; assert result['capabilities']['output_safety']['allows_canonical_macos_tmp_alias'] is True; assert all(result['capabilities']['output_safety']['guards'].values()); assert all(result['capabilities']['output_safety']['stage_output_tree_guards'].values()